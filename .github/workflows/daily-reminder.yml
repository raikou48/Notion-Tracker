name: Daily Task Reminder

on:
  schedule:
    # 11 AM ET coverage:
    - cron: '0 15 * * *'   # 15:00 UTC = 11am EDT (Mar–Nov)
    - cron: '0 16 * * *'   # 16:00 UTC = 11am EST (Nov–Mar)
    # 5 PM ET coverage:
    - cron: '0 21 * * *'   # 21:00 UTC = 5pm EDT (Mar–Nov)
    - cron: '0 22 * * *'   # 22:00 UTC = 5pm EST (Nov–Mar)
    # 9 PM ET coverage:
    - cron: '0 1 * * *'    # 01:00 UTC = 9pm EDT (Mar–Nov)
    - cron: '0 2 * * *'    # 02:00 UTC = 9pm EST (Nov–Mar)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run daily reminder
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: python daily_reminder.py

