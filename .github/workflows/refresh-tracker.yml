name: Refresh Notion Tracker

on:
  schedule:
    # Runs every 5 minutes — the minimum interval GitHub Actions allows.
    # In practice, GitHub schedules these on a "best effort" basis, so actual
    # runs may be a few minutes late during busy periods.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Lets you click "Run workflow" in the Actions tab to refresh on demand.

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run refresh script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
        run: python refresh_tracker.py

